services:
  - type: web
    name: fow-prod
    env: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_DEBUG
        value: false
      - key: VITE_SHARE_URL
        value: https://fog-0tou.onrender.com/

  - type: web
    name: fow-dev
    env: static
    branch: dev
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_DEBUG
        value: true
