# Render Blueprint: два статик-сайти з одного репозиторія.
# Застосування: dashboard.render.com -> New -> Blueprint -> вибрати репозиторій.
# Або створити два Static Site вручну (гілки main і dev, Publish Directory ".",
# Build Command "bash inject-config.sh") і задати env в веб-панелі.
services:
  - type: web
    name: fow-prod
    runtime: static
    branch: main
    buildCommand: bash inject-config.sh
    staticPublishPath: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_DEBUG
        value: false

  - type: web
    name: fow-dev
    runtime: static
    branch: dev
    buildCommand: bash inject-config.sh
    staticPublishPath: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_DEBUG
        value: true
